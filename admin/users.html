<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Users — APEX MOTORS Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Barlow+Condensed:wght@400;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="admin.css"/>
</head>
<body>
<div class="admin-layout">
  <aside class="admin-sidebar" id="admin-sidebar"></aside>
  <div class="admin-main">
    <div class="admin-topbar">
      <div class="admin-page-title">Users</div>
      <div class="admin-topbar-right">
        <span id="users-count" style="font-size:0.65rem;color:var(--text-muted)"></span>
      </div>
    </div>
    <div class="admin-content">
      <div class="admin-card">
        <div class="admin-filters">
          <button class="admin-filter-btn active" data-filter="">All</button>
          <button class="admin-filter-btn" data-filter="admin">Admins</button>
          <button class="admin-filter-btn" data-filter="customer">Customers</button>
          <input type="text" class="admin-search" id="users-search" placeholder="Search name or email…"/>
        </div>
        <div class="admin-table-wrap">
          <table class="admin-table">
            <thead>
              <tr><th>#</th><th>Name</th><th>Email</th><th>Role</th><th>Joined</th><th>Actions</th></tr>
            </thead>
            <tbody id="users-tbody"><tr><td colspan="6" class="empty-state">Loading…</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="admin.js"></script>
<script src="users.js"></script>
</body>
</html>
