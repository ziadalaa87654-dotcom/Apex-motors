<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Messages — APEX MOTORS Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Barlow+Condensed:wght@400;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="admin.css"/>
</head>
<body>
<div class="admin-layout">
  <aside class="admin-sidebar" id="admin-sidebar"></aside>
  <div class="admin-main">
    <div class="admin-topbar">
      <div class="admin-page-title">Contact Messages</div>
      <div class="admin-topbar-right"><span id="msg-count" style="font-size:0.65rem;color:var(--text-muted)"></span></div>
    </div>
    <div class="admin-content">
      <div class="admin-card">
        <div class="admin-filters">
          <button class="admin-filter-btn active" data-filter="">All</button>
          <button class="admin-filter-btn" data-filter="new">New</button>
          <button class="admin-filter-btn" data-filter="read">Read</button>
          <button class="admin-filter-btn" data-filter="resolved">Resolved</button>
          <input type="text" class="admin-search" id="msg-search" placeholder="Search name or email…"/>
        </div>
        <div class="admin-table-wrap">
          <table class="admin-table">
            <thead><tr><th>#</th><th>Name</th><th>Email</th><th>Subject</th><th>Date</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody id="msg-tbody"><tr><td colspan="7" class="empty-state">Loading…</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="admin-modal-overlay" id="msg-modal">
  <div class="admin-modal" style="max-width:580px">
    <div class="admin-modal-header">
      <div class="admin-modal-title">Message Detail</div>
      <button class="admin-modal-close" id="msg-modal-close">&times;</button>
    </div>
    <div class="admin-modal-body" id="msg-modal-body"></div>
  </div>
</div>

<script src="admin.js"></script>
<script src="contacts.js"></script>
</body>
</html>
